openapi: 3.0.3
info:
  title: Timy API
  version: 0.1.0
  description: Partial API contract for the Timy backend.
servers:
  - url: /api/v1
paths:
  /health:
    get:
      summary: Health and readiness check
      responses:
        '200':
          description: Service operational
        '503':
          description: Database unavailable

  /auth/login:
    post:
      summary: Authenticate a user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - identifier
                - password
              properties:
                identifier:
                  type: string
                password:
                  type: string
      responses:
        '200':
          description: Login successful
        '401':
          description: Invalid credentials

  /auth/refresh:
    post:
      summary: Refresh access token
      responses:
        '200':
          description: Tokens rotated

  /auth/logout:
    post:
      summary: Revoke the current session
      responses:
        '200':
          description: Logged out

  /auth/me:
    get:
      summary: Get current authenticated user
      responses:
        '200':
          description: Current user

  /admin/users:
    get:
      summary: List admin-managed users
      responses:
        '200':
          description: Users list
    post:
      summary: Create a provisioned user
      responses:
        '201':
          description: User created

  /venues/availability:
    get:
      summary: Find available venues for a time slice
      parameters:
        - in: query
          name: dayOfWeek
          schema:
            type: string
          required: true
        - in: query
          name: startTime
          schema:
            type: string
          required: true
        - in: query
          name: endTime
          schema:
            type: string
          required: true
      responses:
        '200':
          description: Availability result

  /timetables/validate-slot:
    post:
      summary: Validate a proposed slot against conflicts
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - id
                - day
                - startTime
                - endTime
                - venueId
                - lecturerId
                - offeringId
                - cohortId
              properties:
                id:
                  type: string
                day:
                  type: string
                startTime:
                  type: string
                endTime:
                  type: string
                venueId:
                  type: string
                lecturerId:
                  type: string
                offeringId:
                  type: string
                cohortId:
                  type: string
      responses:
        '200':
          description: Validation result
