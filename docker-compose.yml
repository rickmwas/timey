version: "3.8"

services:
  # Primary PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: timy_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: timy_db
    ports:
      - "5432:5432"
    volumes:
      - timy_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d timy_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Adminer (Visual Web UI for Database Inspection)
  adminer:
    image: adminer:latest
    container_name: timy_adminer
    restart: always
    ports:
      - "8080:8080"
    depends_on:
      - postgres

volumes:
  timy_pgdata:
    name: timy_pgdata
